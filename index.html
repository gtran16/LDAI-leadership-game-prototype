<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Leadership Game V4</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Shell: global ===== */
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#FFF7E6;color:#1E1B3A;font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:500}
button,textarea,input,select{font-family:inherit}
:focus-visible{outline:3px solid #5B3DF5;outline-offset:3px}
.lgbar{background:#1E1B3A;position:relative;z-index:5}
.lgbarin{max-width:1480px;margin:0 auto;padding:6px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
.lgbrand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff;text-decoration:none}
.lgmark{width:28px;height:28px;border-radius:9px;background:#FFC93C;border:2px solid #fff;transform:rotate(-8deg)}
.lgnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lgnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:800;color:#CFCBF5;text-decoration:none}
.lgnav a:hover{color:#fff;background:rgba(255,255,255,.12)}
.lgnav a[aria-current="page"]{color:#1E1B3A;background:#FFC93C}
.lgtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lgtools .status{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;border:2px solid #fff;color:#1E1B3A;background:#CFCBF5}
.lgtools button.status{cursor:pointer;background:#fff}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:9;background:#fff;padding:8px 12px;border-radius:8px}

/* ===== Shell pages (scoped to .pg) ===== */
.pg a{color:#5B3DF5;text-decoration:none;font-weight:700}.pg a:hover{text-decoration:underline}
.pg .col{max-width:720px;margin:0 auto;padding:28px 24px 96px;display:flex;flex-direction:column;gap:24px}
.pg .wrap{max-width:1000px;margin:0 auto;padding:28px 24px 72px;display:flex;flex-direction:column;gap:20px}
.pg .pwrap{max-width:1180px;margin:0 auto;padding:28px 24px 96px;display:flex;flex-direction:column;gap:22px}
.pg .eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#5A5675}
.pg .lab{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5A5675}
.pg .muted{color:#5A5675}
.pg .h1{margin:0;font-size:36px;line-height:1.15;font-weight:900}
.pg .h2{margin:0;font-size:21px;line-height:1.25;font-weight:900;letter-spacing:-0.015em}
.pg .card{background:#fff;border:2px solid #1E1B3A;border-radius:18px;padding:18px 20px;box-shadow:0 4px 0 #1E1B3A;display:flex;flex-direction:column;gap:12px}
.pg .chip{display:inline-flex;align-items:center;align-self:flex-start;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800;background:#EFE9FF;color:#3A24B8;border:2px solid #1E1B3A}
.pg .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border:2px solid #1E1B3A;border-radius:14px;background:#5B3DF5;color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #1E1B3A;text-decoration:none}
.pg .btn:hover{background:#4A2DE0;text-decoration:none}
.pg .btn2{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;color:#1E1B3A;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #1E1B3A;text-decoration:none}
.pg .btn2:hover{background:#F1ECFF;text-decoration:none}
.pg .num{display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #1E1B3A;font-weight:900;font-size:15px;background:#FFC93C;color:#1E1B3A}
.pg .row{display:flex;gap:14px;align-items:flex-start}
.pg .row p{margin:0;font-size:17px;line-height:1.55}
.pg .av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;border:2px solid #1E1B3A;font-weight:900}
.pg .sel{min-height:52px;padding:0 14px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;font-size:17px;font-weight:800;color:#1E1B3A}
.pg .sk,.pg .tab{min-height:44px;padding:0 14px;border:2px solid #1E1B3A;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;color:#1E1B3A;background:#fff}
.pg .sk[aria-pressed="true"],.pg .tab[aria-pressed="true"],.pg .tab[aria-selected="true"]{background:#FFC93C}
.pg .ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg .rung{border:2px solid #1E1B3A;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45}
.pg .subs{display:flex;flex-direction:column;border:2px solid #1E1B3A;border-radius:14px;overflow:hidden}
.pg .sub{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:10px 14px;font-size:15px;line-height:1.45;border-top:1px solid #E5DCC4}
.pg .sub:first-child{border-top:none}
.pg .toggle{min-height:52px;width:100%;padding:0 18px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;font-size:17px;font-weight:900;color:#1E1B3A;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.pg .howgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pg .pgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.pg .pick{display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 14px;border:2px solid #1E1B3A;border-radius:14px;text-align:left;cursor:pointer;color:#1E1B3A;background:#fff;box-shadow:0 3px 0 #1E1B3A}
.pg .pick[aria-pressed="true"]{background:#FFE9A8;box-shadow:0 1px 0 #1E1B3A}
.pg .pick.core{background:#F1ECFF}
.pg .pick.core[aria-pressed="true"]{background:#FFE9A8}
.pg .sec{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:0;border:none;background:none;cursor:pointer;text-align:left;color:#1E1B3A}
.pg .item{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid #CFC3A5}
.pg .defn{padding:24px 26px;border-radius:14px;background:#F1ECFF;display:flex;flex-direction:column;gap:10px}
.pg .know{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:#E6F5EC;border:2px solid #1E1B3A}
.pg .mexgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pg .mex{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:2px solid #EFE6CC;border-radius:12px}
.pg .mbar{display:flex;gap:2px}.pg .mbar span{flex:1;height:10px;border:2px solid #1E1B3A;border-radius:3px}
@media (max-width:700px){.pg .mexgrid{grid-template-columns:minmax(0,1fr)}}
.pg .sktabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pg .sktab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 12px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;font-size:17px;font-weight:900;color:#1E1B3A;cursor:pointer;box-shadow:0 3px 0 #1E1B3A}
.pg .sktab[aria-selected="true"]{background:#FFC93C;box-shadow:0 1px 0 #1E1B3A;transform:translateY(2px)}
.pg .skhead{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.pg .sksec{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:2px solid #1E1B3A;border-radius:16px;background:#fff}
.pg .skh{margin:0;font-size:19px;font-weight:900}
.pg .sklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pg .sklist li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.5}
.pg .skmark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:900;margin-top:2px}
.pg .dodont{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pg .skframe{padding:8px 12px;border:2px dashed #5A5675;border-radius:10px;background:#FFFDF6;font-size:16px;font-weight:700}
.pg .skex{padding:12px 14px;border-left:6px solid #5B3DF5;border-radius:10px;background:#F7F1DF}
@media (max-width:700px){.pg .dodont{grid-template-columns:minmax(0,1fr)}.pg .sktabs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.pg .pgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.pg .ladder,.pg .howgrid{grid-template-columns:minmax(0,1fr)}.pg .sub{grid-template-columns:minmax(0,1fr);gap:2px}}

/* ===== Game styles (scoped to .app-game) ===== */
.app-game, .app-game *{box-sizing:border-box}
.app-game{color-scheme:light}
.app-game{margin:0;background:#FFF7E6;color:#1E1B3A;font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:500}
.app-game button,.app-game textarea,.app-game input{font-family:inherit}
.app-game :focus-visible{outline:3px solid #5B3DF5;outline-offset:3px}
.app-game .bar{background:#1E1B3A}
.app-game .barin{max-width:1180px;margin:0 auto;padding:6px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
.app-game .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff}
.app-game .mark{width:28px;height:28px;border-radius:9px;background:#FFC93C;border:2px solid #fff;transform:rotate(-8deg)}
.app-game .status{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;border:2px solid #fff;color:#1E1B3A;background:#CFCBF5}
.app-game .layout{max-width:1440px;margin:0 auto;padding:20px 24px 96px;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:1100px){.app-game .layout{grid-template-columns:minmax(0,1fr)}
}
.app-game .main{display:flex;flex-direction:column;gap:20px;min-width:0}
.app-game .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1100px){.app-game .side{position:static}
}
.app-game .pills{display:flex;flex-wrap:wrap;gap:6px}
.app-game .pill{min-height:40px;padding:0 12px;border:2px solid #1E1B3A;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:#1E1B3A}
.app-game .pill[aria-current="step"]{background:#FFC93C}
.app-game .eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#5A5675}
.app-game .lab{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5A5675}
.app-game .muted{color:#5A5675}
.app-game .card{background:#fff;border:2px solid #1E1B3A;border-radius:18px;padding:18px 20px;box-shadow:0 4px 0 #1E1B3A;display:flex;flex-direction:column;gap:10px}
.app-game .sofar{padding:12px 16px;border-radius:14px;background:#F1ECFF;border:2px solid #1E1B3A;font-size:16px}
.app-game .para{margin:0;font-size:18px;line-height:1.65}
.app-game h2{margin:0;font-size:21px;font-weight:900}
.app-game .opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;text-align:left;font-size:16px;line-height:1.5;font-weight:700;color:#1E1B3A;cursor:pointer;border:2px solid #1E1B3A;background:#fff}
.app-game .opt:hover:not([disabled]){background:#FFF1C2}
.app-game .opt[disabled]{cursor:default}
.app-game .opt.on{background:#FFE9A8}
.app-game .opt.dim{opacity:.45}
.app-game .letter,.app-game .av{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #1E1B3A;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;background:#fff}
.app-game .av{background:#C9B8FF}
.app-game .answer{margin:0 0 0 14px;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid #1E1B3A;font-size:16px}
.app-game .verdict{margin-left:40px;padding:8px 12px;border-radius:10px;border:2px solid #1E1B3A;font-size:15px}
.app-game .field{width:100%;min-height:48px;padding:10px 14px;border:2px solid #1E1B3A;border-radius:12px;background:#fff;color:#1E1B3A;font-size:16px}
.app-game .btn2{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;color:#1E1B3A;font-size:16px;font-weight:800;text-decoration:none;box-shadow:0 4px 0 #1E1B3A}
.app-game .modalback{position:fixed;inset:0;background:rgba(30,27,58,.45);z-index:20}
.app-game .modal{position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fff;border:2px solid #1E1B3A;border-radius:18px;box-shadow:0 6px 0 #1E1B3A;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.app-game .scrollp{max-height:62vh;overflow:auto}
.app-game .mgrid{display:flex;flex-direction:column;gap:8px}
.app-game .mrow{border:2px solid #EFE6CC;border-radius:12px;padding:8px 12px;background:#fff}
.app-game .mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-game .mdot{width:12px;height:12px;border-radius:50%;border:2px solid #1E1B3A}
.app-game .mnow{margin-left:auto;font-size:13px;font-weight:800;color:#5A5675}
.app-game .mwhy{font-size:15px;line-height:1.5;margin-top:2px}
.app-game .review>summary{cursor:pointer;font-weight:800;color:#5B3DF5}
.app-game details.info{display:inline-block;vertical-align:middle;position:relative;font-size:14px;font-weight:600}
.app-game details.info>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;border:2px solid #5B3DF5;color:#5B3DF5;background:#fff;font-weight:900;font-size:13px}
.app-game details.info>summary::-webkit-details-marker{display:none}
.app-game details.info[open]>summary{background:#5B3DF5;color:#fff}
.app-game .newchip{display:inline-block;vertical-align:middle;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#3A24B8;background:#EFE9FF;border:1.5px solid #3A24B8;border-radius:999px;padding:0 8px}
.app-game .newnote{margin:0;font-size:15px;color:#3A24B8;font-weight:700}
.app-game .infobox{position:absolute;z-index:8;left:0;top:32px;width:min(320px,80vw);background:#F1ECFF;border:2px solid #5B3DF5;border-radius:12px;padding:10px 12px;color:#1E1B3A;font-size:14px;line-height:1.5;box-shadow:0 4px 0 #5B3DF5}
.app-game .teamp{font-size:13px;line-height:1.4;gap:8px;padding:12px 14px}
.app-game .modal.wide{width:min(860px,94vw)}
.app-game .whogrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.app-game .whogrid{grid-template-columns:1fr}
}
.app-game .whocol{display:flex;flex-direction:column;gap:10px}
.app-game .whocard{display:flex;flex-direction:column;gap:3px;border:2px solid #EFE6CC;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.app-game .who{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:1px solid #EFE6CC}
.app-game .who .av{width:28px;height:28px;font-size:13px}
.app-game .rolechip{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid;border-radius:999px;padding:0 8px}
.app-game .focusbar{border:2px solid #2563EB;border-radius:14px;background:#EAF2FF;padding:10px 14px;font-size:15px;color:#1E3A8A;display:flex;flex-direction:column;gap:4px}
.app-game .skillchip{vertical-align:middle;margin-left:8px;min-height:34px;padding:0 12px;border:2px solid #2563EB;border-radius:999px;background:#EAF2FF;color:#1E3A8A;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #2563EB;transition:transform .1s}
.app-game .skillchip:hover{background:#2563EB;color:#fff;transform:translateY(-1px)}
.app-game .skillchip:focus-visible{outline:3px solid #5B3DF5;outline-offset:3px}
.app-game .focusline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.app-game .focusbtns{display:flex;gap:6px;flex-wrap:wrap}
.app-game .fbtn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:2px solid #2563EB;border-radius:10px;background:#fff;color:#1E3A8A;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none}
.app-game .fbtn.off{opacity:.55;cursor:default}
.app-game .focusbar summary{color:#1E3A8A;font-weight:800;cursor:pointer;font-size:14px}
.app-game .grow{resize:none;overflow:hidden;line-height:1.5;display:block}
.app-game .field[disabled],.app-game .ta[disabled]{background:#F6F1E4;color:#3B3760}
.app-game .ta{width:100%;padding:12px 14px;border:2px solid #1E1B3A;border-radius:14px;background:#fff;color:#1E1B3A;font-size:16px;line-height:1.5;resize:vertical}
.app-game .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:2px solid #1E1B3A;border-radius:14px;background:#5B3DF5;color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #1E1B3A}
.app-game .btn:hover:not([disabled]){background:#4A2DE0}
.app-game .btn[disabled]{opacity:.45;cursor:not-allowed}
.app-game .ghost{min-height:44px;padding:0 6px;border:none;background:none;color:#5B3DF5;font-size:15px;font-weight:800;cursor:pointer;align-self:flex-start}
.app-game .ai{border:2px dashed #1E1B3A;border-radius:18px;padding:18px 20px;background:#FFFDF6;display:flex;flex-direction:column;gap:10px}
.app-game .chip{display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800;border:2px solid #1E1B3A}
.app-game .chip.live{background:#E6F5EC;color:#0E7A4D}
.app-game .chip.capt{background:#FFF4D6;color:#7A4A00}
.app-game .chip.ai{background:#EFE9FF;color:#3A24B8}
.app-game .panel{background:#fff;border:2px solid #1E1B3A;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.app-game details{border-top:1px dashed #1E1B3A;padding-top:8px;font-size:14px}
.app-game summary{cursor:pointer;font-weight:800;color:#5B3DF5;min-height:32px}
.app-game pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #CFC3A5;border-radius:10px;padding:10px;font-size:12px;line-height:1.45;max-height:420px;overflow:auto}
.app-game .spin{display:inline-block;width:16px;height:16px;border:3px solid #CFCBF5;border-top-color:#5B3DF5;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.app-game .err{background:#FDECEA;border:2px solid #B42318;border-radius:12px;padding:10px 14px;font-size:15px}
.app-game .glance{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px solid #CFC3A5}
.app-game .tag{padding:0 8px;border-radius:999px;border:1px solid #1E1B3A;font-size:12px;font-weight:700}
.app-game .meterwrap{max-width:1440px;margin:0 auto;padding:12px 24px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;background:#FFF7E6;border-bottom:2px solid #1E1B3A;position:sticky;top:0;z-index:5}
@media (max-width:800px){.app-game .meterwrap{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.app-game .story{background:#fff;border:2px solid #1E1B3A;border-radius:22px;padding:28px 30px;box-shadow:0 6px 0 #FFC93C;display:flex;flex-direction:column;gap:16px}
.app-game .person{display:flex;gap:12px;align-items:flex-start;border:2px solid #1E1B3A;border-radius:14px;padding:12px 14px}
.app-game .tipcard{border:2px solid #5B3DF5;border-radius:14px;padding:12px 14px;background:#F1ECFF;font-size:15px}

  active: '',
  /* Every AI call in the game and the practice round goes through LG.sample(). On claude.ai it uses the artifact's built-in AI.
     For GitHub Pages, replace this one function with a call to the Worker. Nothing else changes. */
  _s: null,
  /* Off claude.ai (GitHub Pages), calls go to the Cloudflare Worker in worker/. Empty means no live AI. */
  WORKER_URL: '',
  sample() {
    if (!LG._s) LG._s = (async () => {
      try { if (window.claude && window.claude.use) return await window.claude.use('sample'); } catch (e) { /* fall through to the Worker */ }
      return LG.WORKER_URL ? LG.workerSample : null;
    })();

- Boss standing: results, visible follow-through, raising risks and bad news at the right time, alignment with direction, communicating up, managing people and time well.
- Business impact: delivery and quality, clean handoffs, speed versus rework, dependencies tracked or missed, opportunities opened or closed.

THEN WRITE
1. note: the boss's note, addressed to the player by name, in five short parts, under 220 words in total.

RULES
1. The verdict is fixed. The note fits it: Ready now leads with what carries into the next role; Ready with support names the support; Practice more at this level frames the next decisions as more reps on the same skills, a matter of timing and practice, never a judgment of the person.
2. Never treat high meters as the goal. Credit balance: spending one meter to protect another, and going back for it.
3. Praise effort, strategy and growth, never ability. Credit what the player did, chose, asked, tried and improved ("you asked Ravi what was already on their calendar"), never what they are ("you're a natural", "you're smart", "you have good instincts"). Explain what went well by the moves and effort behind it, and what went less well by moves the player can change. Where a later decision handled a pattern better than an earlier one, name the change.

5. No scores, grades, ratings or counts of verdicts. No flattery, no catastrophizing, no moralizing.
6. Do not repeat a point across sections. Do not restate per-decision feedback the player already saw; find what only shows across the level.

}

async function ask(name, prompt, tier) {
  const t0 = Date.now(); let text = '';
  for (let k = 0; k < 2; k++) {
    const p = k === 0 ? prompt : prompt + '\n\nReply with the JSON object only: no other text, no code fences.';
    const t1 = Date.now();
    const raw = await sample(p, { modelTier: tier, onText: (u) => { const el = document.getElementById('prog'); if (el && G.designer) el.textContent = Math.round((u.text || '').length / 100) / 10 + 'k characters written, ' + Math.round((Date.now() - t1) / 1000) + ' s'; } });
    text = raw && raw.text ? raw.text.trim() : '';
    const v = raw && !raw.truncated ? parseJSON(text) : null;
    if (v) { const call = { name, prompt, reply: text, ms: Date.now() - t0, retried: k > 0 }; rl(Object.assign({ kind: 'call' }, call)); return { value: v, call }; }
  }
  const e = new Error('The AI’s reply came back unreadable, even after one retry. Your answers are kept; try again.'); e.step = name; e.call = { name, prompt, reply: text || '(empty)', ms: Date.now() - t0 }; rl(Object.assign({ kind: 'call', failed: true }, e.call)); throw e;
}

/* ---------- normalize P2 output ---------- */
function pick(o, keys) { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return undefined; }
function normDelta(d) { const o = {}; METERS.forEach(m => { o[m.key] = clamp(Math.round(+((d || {})[m.key] || 0)), -3, 3); }); return o; }
function normSince(x) {
  if (!x || typeof x !== 'object') return null;
  const k = String(x.meter || x.key || '').toLowerCase(), key = /team/.test(k) ? 'team' : /boss/.test(k) ? 'boss' : /business|impact/.test(k) ? 'business' : null;

}
function normScene(v) {

  if (brief.length < 1 || questions.length < 2) throw new Error('The scene came back incomplete (brief ' + brief.length + ', questions ' + questions.length + ').');
  const f = v.focus || {}, sc = v.skill_check || {};

}
function normOptions(v) {

      const ver = String(pick(x, ['verdict', 'type', 'label', 'kind']) || (x.lands === true ? 'lands' : x.lands === false ? 'pitfall' : '')).toLowerCase();
      const ps = x.pitfall_shift || x.shift || {};
      return { text: String(x.text || ''), lands: /land|strong/.test(ver), why: String(x.why || ''), shift: normDelta(ps.delta || ps), note: String(pick(x, ['note', 'story_note']) || (ps.note || '')) };

/* V4 support fade (Nov 27, 2-1-3): 1 and 2 pick everything; 3 picks the plan and writes the tradeoff and first words; 4 to 6 write all three. The player does not choose the mode. */

/* Chapter 1: no judge call; code builds the same report shape from the chosen option and opening. */
function codeJudge(D, c) {

  const shifts = {};
  METERS.forEach(m => { shifts[m.key] = { delta: o.delta[m.key] + (op.lands ? 0 : (op.shift[m.key] || 0)), reason: (o.reasons[m.key] || '') + (op.lands ? '' : ' The opening added to this.') }; });

/* ---------- flow ---------- */
async function loadDecision(n) {
  if (G.dec[n] && (G.dec[n].D || G.dec[n].pending)) return G.dec[n].pending;
  const slot = G.dec[n] = { D: null, calls: [], err: null, optReady: false, optErr: null, optPending: null };
  slot.pending = (async () => {
    try { const r = await ask('P2a scenario builder, decision ' + n, fillP2A(n), TIER.P2); slot.calls.push(r.call); slot.D = normScene(r.value); }
    catch (e) { slot.err = e; if (e.call) slot.calls.push(e.call); slot.pending = null; return slot; }
    slot.pending = null; loadOptions(n); return slot;
  })();
  return slot.pending;
}
function loadOptions(n) {
  const slot = G.dec[n]; if (!slot || !slot.D) return null;
  slot.optErr = null;
  slot.optPending = (async () => {
    try { const r = await ask('P2b decision builder, decision ' + n, fillP2B(n, slot.D.raw), TIER.P2); slot.calls.push(r.call); const o = normOptions(r.value); Object.assign(slot.D, o); slot.D.raw = Object.assign({}, slot.D.raw, r.value); slot.optReady = true; }
    catch (e) { slot.optErr = e; if (e.call) slot.calls.push(e.call); }
    slot.optPending = null; if (G.n === n && G.phase === 'optwait') afterOptions(); return slot;
  })();
  return slot.optPending;
}
function afterOptions() {
  const slot = G.dec[G.n];
  if (slot.optReady) { G.phase = 'decide'; G.err = ''; render(); toTop(); }
  else if (slot.optErr) { G.phase = 'opterr'; G.err = slot.optErr.message || 'The options could not be written.'; G.errCalls = slot.calls; render(); }
}

function freshCur() { return { asked: [], pick: null, opening: null, conf: null, tp: '', tc: '', tw: '', tt: '', plan: '', open: '', advT: false, advO: false, advP: false, mPlan: 'pick', mTrade: 'pick', mOpen: 'pick', result: null }; }
async function startDecision(n) {
  G.n = n; G.cur = freshCur(); G.tab = 'team'; G.help.tab = { 3: 'tradeoff', 4: 'plan' }[n] || 'plan'; /* open on the part that is new this decision */ G.err = ''; G.errCalls = null;
  if (!live) { G.phase = 'nolive'; render(); return; }
  G.phase = 'loading'; G.busy = 'Writing your next scene…'; render();
  let slot = G.dec[n];
  if (!slot || (!slot.D && !slot.pending)) { await loadDecision(n); slot = G.dec[n]; }
  else if (slot.pending) await slot.pending;
  if (!slot.D) { G.err = (slot.err && slot.err.message) || 'The scene could not be written.'; G.errCalls = slot.calls; G.dec[n] = null; G.phase = 'loaderr'; render(); return; }
  if (slot.D.sinceLast && !slot.D.sinceDone) { const sl = slot.D.sinceLast; slot.D.sinceDone = true; const d = capUp(sl.key, sl.d); G.meters[sl.key] = clamp(G.meters[sl.key] + d, 0, 10); sl.applied = d; rl({ kind: 'since', n, meter: sl.key, delta: d, reason: sl.reason }); }
  if (!slot.logged) { slot.logged = true; try { const D = slot.D; rl({ kind: 'scene', n, brief: (D.brief || []).join(' '), questions: (D.questions || []).map(q => q.to + ': ' + q.q + ' -> ' + q.a).join(' | ') }); } catch (e) {} }
  G.phase = 'scene'; G.t0 = Date.now(); render(); toTop();
}
async function commit() {
  const D = G.dec[G.n].D, c = G.cur, calls = [];
  G.phase = 'committing'; G.busy = 'Finding out what happens…'; G.err = ''; render();
  try {
    let judge;
    const M = modes(c, band(G.n));
    if (M.planPick && M.tradePick && M.openPick) judge = codeJudge(D, c);
    else { const j = await ask('P3 judge, decision ' + G.n, fillP3(D, c), TIER.P3); calls.push(j.call); judge = j.value; if (!judge.shifts) throw Object.assign(new Error('The judge reply had no meter shifts.'), { call: j.call }); zeroGuard(D, c, judge); }
    wellbeingRule(D, c, judge);
    G.busy = 'Writing what happened\u2026'; render(); /* Nov 19 (B9): debrief shows all at once */
    const nar = await ask('P4 narrator, decision ' + G.n, fillP4(D, c, judge), TIER.P4); calls.push(nar.call);
    const N = nar.value; if (!N.story_entry) throw Object.assign(new Error('The narrator reply had no story.'), { call: nar.call });
    applyResult(D, c, judge, N, calls); G.preview = null;
    G.phase = 'debrief'; render(); toTop();
    if (G.n < NDEC) loadDecision(G.n + 1);
  } catch (e) { if (e.call) calls.push(e.call); G.err = e.code === 'rate_limited' ? 'The AI is busy. Wait a minute, then try again.' : (e.message || 'Something went wrong.'); G.errCalls = calls; G.preview = null; G.phase = 'decide'; render(); }
}
/* Nov 27: P3 starts from the chosen option's deltas. If it returns no movement on team, boss and business while the picked option has some, use the option's deltas and log it. */
function zeroGuard(D, c, judge) {
  const o = c.pick !== null ? D.options[c.pick] : null; if (!o) return;
  const keys = ['team', 'boss', 'business'], d = (k) => { const x = (judge.shifts || {})[k]; return Math.round(+(x && x.delta != null ? x.delta : x) || 0); };
  if (keys.some(k => d(k)) || !keys.some(k => o.delta[k])) return;
  keys.forEach(k => { judge.shifts[k] = { delta: o.delta[k], reason: (o.reasons && o.reasons[k]) || '', set_by: 'code: judge returned no movement, used the picked option' }; });
  judge.zero_guard = true; rl({ kind: 'note', n: G.n, text: 'Judge returned no meter movement; used the picked option deltas.' });
}
/* Wellbeing is set by code, not AI (Giselle's rule, Nov 18):
   holds at default; taking work on yourself dips 1, or 2 if you took work on within the last 3 decisions;
   recovery is gradual: +1 after every 3 decisions without taking work on, +2 when you step away; never above default. */
const WB_DEFAULT = 7;
function wellbeingRule(D, c, judge) {
  const o = c.pick !== null ? D.options[c.pick] : null;

function act(a) {
  if (a === 'introNext') { G.introI++; render(); }
  else if (a === 'introBack') { G.introI = Math.max(0, G.introI - 1); render(); }
  else if (a === 'skipIntro') { G.introI = INTRO.length - 1; render(); }

  else if (a === 'rlLast3') { G.rlWhich = 'last3'; render(); }

  else if (a === 'toDecide') { G.tab = 'scene'; const sl = G.dec[G.n]; if (sl.optReady) { G.phase = 'decide'; render(); toTop(); } else { G.phase = 'optwait'; render(); toTop(); if (!sl.optPending) loadOptions(G.n); } }
  else if (a === 'retryOptions') { G.phase = 'optwait'; render(); loadOptions(G.n); }
  else if (a === 'toScene') { G.phase = 'scene'; render(); }
  else if (a === 'advT') { G.cur.advT = !G.cur.advT; render(); }
  else if (a === 'advO') { G.cur.advO = !G.cur.advO; render(); }
  else if (a === 'advP') { G.cur.advP = !G.cur.advP; render(); }
  else if (a === 'preDone') { G.pc.pre.done = true; runCheck('pre'); G.phase = 'intro'; render(); toTop(); }
  else if (a === 'postDone') { G.pc.post.done = true; runCheck('post'); G.phase = 'review'; G.rvJump = 'Before and after'; render(); toTop(); }
  else if (a === 'toPost') { G.phase = 'post'; render(); toTop(); }
  else if (a === 'pcSkip') { G.pc.skipped = true; if (G.phase === 'pre') G.phase = 'intro'; else if (G.phase === 'post') { G.phase = 'review'; G.rvJump = 'Your record'; } render(); toTop(); }
  else if (a === 'playAgain') { const r = document.getElementById('restart'); if (r) r.click(); toTop(); }
  else if (a === 'openSheet') { G.phase = 'sheet'; G.sheetCopied = false; G.sheetMsg = ''; render(); toTop(); }
  else if (a === 'closeSheet') { G.phase = 'review'; G.rvJump = 'Your record'; render(); toTop(); }
  else if (a === 'printSheet') { try { window.print(); } catch (e) { G.sheetMsg = 'Printing isn\u2019t available in this view. Use Copy as text, or open the game from its GitHub link to print.'; render(); } }
  else if (a === 'copySheet') { const t = sheetText(); const done = () => { G.sheetCopied = true; render(); }; const fall = () => { try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } catch (e) { G.sheetMsg = 'Copying isn\u2019t available here. Select the sheet text and copy it.'; render(); } }; try { navigator.clipboard.writeText(t).then(done, fall); } catch (e) { fall(); } }
  else if (a === 'snapCopy') { const t = snapshotText(); const done = () => { G.snapDone = true; render(); }; try { navigator.clipboard.writeText(t).then(done, () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); }); } catch (e) { done(); } }
  else if (a === 'rvNext') { G.rvI = (G.rvI || 0) + 1; render(); toTop(); }
  else if (a === 'rvBack') { G.rvI = Math.max(0, (G.rvI || 0) - 1); render(); toTop(); }
  else if (a === 'runReview') { if (G.rv && G.rv.call && !G.rv.busy) runReview(); }
  else if (a === 'commit') { if (ready()) commit(); }
  else if (a === 'next') {
    if (G.n === NDEC) { G.endAt = Date.now(); G.phase = 'review'; G.rvI = 0; G.rv = { best: '', back: '', call: null, out: null, busy: false, err: '' }; render(); toTop(); return; }
    const nx = G.n + 1;
    startDecision(nx);
  }
}

[MODE]

[TASK]

GAME MODE ONLY
(not used in practice mode)

PRACTICE MODE ONLY
In practice mode, replace checks 1 to 3 with the rep's own fields and reference ([FIELDS AND REFERENCE]). Report each field as named, partly or missing, with evidence. The trade-off checks are game mode only.
The scenario: [PRACTICE SCENARIO]
The rep: [REP]

THE PLAYER'S ANSWER
[ANSWER]

REPORT
1. checks: for each of the three checks, "named", "partly" or "missing", with the exact words that show it. "Partly" means named without saying who or what specifically.
2. game mode: hidden_fact (not used in practice mode).
3. game mode: events (not used in practice mode).
4. game mode: unknowns (not used in practice mode).
5. game mode: style (not used in practice mode).
6. missing_from_task: only what the three trade-off checks and this decision's one skill check asked for and the answer left out. Gaps that belong to other skills (a queue target, an update to someone else) go in unknowns as story consequences, never here.

RULES

3. If the player asked a peer for advice, credit only what they added in their own words; text copied from the advice is not evidence. Judge what was said, not how polished it is. Short and plain can be complete.

const P4 = `You write what the player reads after a decision, or after a practice rep. Be direct and kind. No scores, no flattery, no moralizing.

practice

function fillP3(r, st) {
  const ri = ROUND.reps.indexOf(r);

  const choice = st.pick !== null ? r.choices[st.pick] : null;
  const fr = 'Fields: ' + r.fields.join(' / ') + '\nReference (for you only):\n' + r.reference.map(x => '- ' + x).join('\n');
  const rep = 'Rep ' + r.n + ', ' + r.sub + ', format ' + (r.format === 'open' ? 'open' : 'choices then fields') + '.' +

    (choice ? '\nThe player chose: "' + choice.text + '" (verdict: ' + choice.v + ')' : '') +

  const keys = 'Use exactly these keys: {"checks": {' + fieldKeys(r).map(k => '"' + k + '": {"status", "evidence", "note"}').join(', ') + '}, "missing_from_task": ["..."]}. status is "named", "partly" or "missing".';
  return SHARED + '\n\n' + P3.replace('[MODE]', 'practice').replace('[TASK]', r.task + (r.format === 'open' ? '' : ' Then say it in your own words in each field.'))
    .replace('[FIELDS AND REFERENCE]', fr).replace('[PRACTICE SCENARIO]', ROUND.setting.company + '. ' + ROUND.setting.team + '.\n' + scenarioText(r))

function fillP4(r, judge, st, last) {

function fillP6() {

/* ============ CODE CHECKS on AI output ============ */
function checkJudge(v, r) {
  if (!v || typeof v !== 'object' || !v.checks) throw new Error('Judge reply had no checks.');
  const out = { checks: {}, missing_from_task: Array.isArray(v.missing_from_task) ? v.missing_from_task.map(String) : [] };
  fieldKeys(r).forEach(k => {
    const found = v.checks[k] || v.checks[Object.keys(v.checks).find(x => x.toLowerCase().startsWith(k.toLowerCase().slice(0, 10))) || ''];
    if (!found) throw new Error('Judge reply was missing the check "' + k + '".');
    const status = String(found.status || '').toLowerCase();
    if (!ST[status]) throw new Error('Judge gave an unknown status for "' + k + '".');
    out.checks[k] = { status, evidence: String(found.evidence || ''), note: String(found.note || '') };
  });
  return out;
}
function checkFeedback(v) {
  if (!v || typeof v.feedback !== 'string' || !v.feedback.trim()) throw new Error('Feedback reply was empty.');
  return v.feedback.trim();
}
function checkDebrief(v) {
  if (!v || !Array.isArray(v.worked) || !Array.isArray(v.work_on) || !v.try_next) throw new Error('Debrief reply was missing a section.');
  return { note: String(v.note || ''), worked: v.worked.map(String), work_on: v.work_on.map(String), try_next: { move: String(v.try_next.move || ''), why: String(v.try_next.why || ''), practice: String(v.try_next.practice || '') } };
}
function parseJSON(text) {

async function ask(prompt, tier) {

    const p = k === 0 ? prompt : prompt + '\n\nReply with the JSON object only: no other text, no code fences.';
    const raw = await sample(p, { modelTier: tier });
    text = raw && raw.text ? raw.text.trim() : '';
    const v = raw && !raw.truncated ? parseJSON(text) : null;
    if (v) return { value: v, text, ms: Date.now() - t0, retried: k > 0 };
  }
  const e = new Error('The AI reply could not be read, even after one retry. Its raw text is below.'); e.raw = text; e.prompt = prompt; throw e;
}

async function checkAnswer() {

    body += sec('Worked examples, at other software companies', [t.ex, t.ex2].filter(Boolean).map((e, i) => (i ? '<hr style="border:0;border-top:1px dashed #CFC3A5;margin:4px 0;width:100%">' : '') + '<p style="margin:0;font-size:16px"><span class="lab">Example ' + (i + 1) + ': the situation</span><br>' + esc(e.scene) + '</p><div class="skex"><span class="lab">What a good ' + SKL[k][1].toLowerCase() + ' sounds like</span><p style="margin:4px 0 0;font-size:17px;line-height:1.6">' + esc(e.text) + '</p></div>').join(''));
  }
  body += sec('Practice ' + SKL[k][1].toLowerCase() + ' on its own', '<p style="margin:0">' + PRACTICE[k] + ' You get feedback after each one, and you can try again.</p><button class="btn" disabled style="align-self:flex-start;opacity:.5;cursor:not-allowed;box-shadow:none">Practice coming soon</button>', 'background:#FFF4D6;border-color:#B45309');
  const wh = GAME && GAME.where && GAME.where();
  const back = wh ? '<a class="btn" href="#play" style="align-self:flex-start">' + (wh.review ? 'Back to your check-in' : 'Back to decision ' + wh.n) + '</a>' : '';
  return '<div class="col" style="gap:20px">' + back + '<div style="display:flex;flex-direction:column;gap:10px"><h1 class="h1">Skills</h1><p style="margin:0;font-size:18px;line-height:1.6">Three parts of one skill: see both sides of a choice, choose on purpose, and say so. If you are in the middle of a game, your place is kept: go back with Play.</p></div>' + tabs + body + '</div>';
}
function about() {
  return '<div class="col"><div style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">How it’s made</div><h1 class="h1" style="font-size:34px">Who made what, and how AI is used</h1>' +
  '<p style="margin:0;font-size:18px;line-height:1.6">This game draws on practitioner experience, learning science, and a belief that practicing leadership can be fun.</p>' +
  '<ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.55"><li>A learning designer designed this game: the format, the learning design, how the AI steps work together, and the experience as a whole.</li><li>AI generated the screens, the code and nearly all the written content, and the designer reviewed it, gave feedback and approved it.</li></ul></div>' +
  SECS.map((x, i) => { const open = !!P.about[i];
    let body = '';
    if (open) body = (x.html ? x.html() : '') + (x.items || []).map((it) => '<div class="item"><div style="font-size:16px;font-weight:800">' + esc(it[0]) + '</div><p style="margin:0;font-size:15px;line-height:1.55">' + esc(it[1]) + '</p>' + (it[2] ? '<p class="muted" style="margin:0;font-size:13px">' + esc(it[2]) + '</p>' : '') + '</div>').join('') +
      (x.lists || []).map((l) => '<div class="item"><div style="font-size:16px;font-weight:800">' + esc(l[0]) + '</div><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.5">' + l[1].map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' + (l[2] ? '<p class="muted" style="margin:0;font-size:13px">' + esc(l[2]) + '</p>' : '') + '</div>').join('');
    return '<section class="card" style="gap:10px"><button class="sec" data-sec="' + i + '" aria-expanded="' + open + '"><span style="font-size:20px;font-weight:900">' + esc(x.title) + '</span><span style="font-size:22px;font-weight:900" aria-hidden="true">' + (open ? '−' : '+') + '</span></button>' + body + '</section>'; }).join('') + '</div>';
}

/* ---------- Router ---------- */
const PAGES = { home, about, 'how-it-works': howPage, skills: skillsPage };
const TITLES = { home: 'The Leadership Game V4', 'how-it-works': 'How the game works', skills: 'Skills', about: 'How it’s made', play: 'Play', practice: 'Practice round' };
const APPS = { play: GAME, practice: PRACTICE };
let cur = '';
function route() {
  let r = (location.hash || '').replace('#', '');
  if (!PAGES[r] && !APPS[r]) r = 'home';
  const stage = $('stage');
  if (r !== cur) {
    if (APPS[cur]) APPS[cur].unmount();
    cur = r;
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  document.querySelectorAll('.lgnav a').forEach((a) => { if (a.dataset.nav.split(' ').includes(r)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = TITLES[r] + (r === 'home' ? '' : ' · The Leadership Game V4');
  if (APPS[r]) { stage.className = ''; APPS[r].mount(stage); }
  else { LG.active = 'page'; $('tools').querySelectorAll('[data-apptool]').forEach((b) => b.remove()); stage.className = 'pg'; stage.innerHTML = PAGES[r](); }
}
function rerender() { if (PAGES[cur]) $('stage').innerHTML = PAGES[cur](); }
document.addEventListener('click', (e) => {
  if (LG.active !== 'page') return;
  const t = e.target.closest('[data-skill],[data-sk],[data-pg],[data-pane],[data-sec],[data-gsk]');
  if (!t) return;
  if (t.dataset.gsk) { P.gsk = t.dataset.gsk; rerender(); return; }
  if (t.dataset.skill) { P.skill = t.dataset.skill; P.pane = 0; if (cur === 'skills') rerender(); else location.hash = 'skills'; return; }
  if (t.dataset.sk) { P.sk = t.dataset.sk; rerender(); return; }
  if (t.dataset.pane) { P.pane = +t.dataset.pane; rerender(); return; }
  if (t.dataset.sec) { P.about[t.dataset.sec] = !P.about[t.dataset.sec]; rerender(); return; }
  if (t.dataset.pg === 'how') { P.how = !P.how; rerender(); }
});
document.addEventListener('change', (e) => { if (LG.active !== 'page' || !e.target.dataset) return; if (e.target.dataset.pg === 'lvl') { P.lvl = e.target.value; rerender(); } if (e.target.dataset.pg === 'slvl') { P.slvl = +e.target.value; rerender(); } });
/* links from inside the game to a skill card */
document.addEventListener('click', (e) => { const g = e.target.closest('[data-goskill]'); if (g) { P.skill = g.dataset.goskill; P.pane = 0; } }, true);
window.addEventListener('hashchange', route);
route();
LG.sample().then((s) => { if (LG.active === 'page') { const st = $('status'); st.textContent = s ? 'Live AI on' : 'Live AI not available here'; st.style.background = s ? '#A7E3C4' : '#FFE9A8'; } });
})();

</script>
</body>
</html>
