<rect x="450" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="460" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Decisions 4-6</text>
<text x="460" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Write all three.</text>
<text x="460" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">The judge marks</text>
<text x="460" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">five checks.</text>
<line x1="582" y1="150.0" x2="592" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="592" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Your own read</text>
<text x="602" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">What went best,</text>
<text x="602" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">what was hard,</text>
<text x="602" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">your readiness</text>
<text x="602" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">call.</text>
<line x1="724" y1="150.0" x2="734" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="734" y="84" width="132" height="132" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="744" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">Verdict</text>
<text x="744" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">Meters out of the</text>
<text x="744" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">red, and 80% of</text>
<text x="744" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">written checks</text>
<text x="744" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">named.</text>
<line x1="866" y1="150.0" x2="876" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="876" y="84" width="132" height="132" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="886" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">Check-in</text>
<text x="886" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">Noor&#x27;s read and</text>
<text x="886" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">what happened</text>
<text x="886" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">next, fit to the</text>
<text x="886" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">verdict.</text>
<line x1="1008" y1="150.0" x2="1018" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1018" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="1028" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Last check</text>
<text x="1028" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">The same scenario</text>
<text x="1028" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">again, then</text>
<text x="1028" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">before and after.</text>
<line x1="1150" y1="150.0" x2="1160" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1160" y="84" width="132" height="132" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="1170" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">1:1 sheet</text>
<text x="1170" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">Questions,</text>
<text x="1170" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">manager support,</text>
<text x="1170" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">reminders. No</text>
<text x="1170" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">game details.</text>
<text x="24" y="246" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px;font-style:italic" fill="#5A5675">Support fades: you pick, then you write one part, then all three. A Skill guide with frames and worked examples sits beside every decision.</text>
<text x="24" y="292" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px" fill="#5A5675">WHERE IT RUNS (THE HOSTED LINK)</text>
<rect x="24" y="306" width="300" height="170" rx="10" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="2"/>
<text x="34" y="328" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1E1B3A">Your browser</text>
<text x="34" y="348" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">One file, index.html, served by GitHub</text>
<text x="34" y="364" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">Pages. It holds the game, the world, all</text>
<text x="34" y="380" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">six prompts and the rules. It keeps the</text>
<text x="34" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">meters, story and run log in the</text>
<text x="34" y="412" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">browser. No accounts.</text>
<rect x="440" y="306" width="300" height="170" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="450" y="328" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">Relay: Cloudflare Worker</text>
<text x="450" y="348" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">Answers only the game&#x27;s page. Stops at</text>
<text x="450" y="364" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">125 calls a day (about 5 games). Picks</text>
<text x="450" y="380" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">the model for each step and caps reply</text>
<text x="450" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">length. Holds the API key as a secret;</text>
<text x="450" y="412" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">the key never reaches the browser.</text>
<rect x="840" y="306" width="290" height="170" rx="10" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="2"/>
<text x="850" y="328" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1E1B3A">Anthropic API</text>
<text x="850" y="348" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">Claude Sonnet 5.5: scene, options,</text>
<text x="850" y="364" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">judge, check-in. Claude Haiku 5.5:</text>
<text x="850" y="380" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">debrief and benchmark marks. Prepaid $10</text>
<text x="850" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">budget, no auto-reload.</text>
