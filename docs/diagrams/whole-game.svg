<rect x="308" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="318" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Decision 3</text>
<text x="318" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Pick the plan;</text>
<text x="318" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">write the</text>
<text x="318" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">trade-off and</text>
<text x="318" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">first words.</text>
