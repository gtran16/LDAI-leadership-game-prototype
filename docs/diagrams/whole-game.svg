<text x="382" y="360" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-style:italic" fill="#5A5675">your text</text>
<line x1="440" y1="420" x2="324" y2="420" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<text x="382" y="440" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-style:italic" fill="#5A5675">reply</text>
<line x1="740" y1="370" x2="840" y2="370" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<text x="790" y="360" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-style:italic" fill="#5A5675">one call</text>
<line x1="840" y1="420" x2="740" y2="420" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<text x="790" y="440" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-style:italic" fill="#5A5675">reply</text>
<rect x="1150" y="306" width="146" height="170" rx="10" fill="#FFFFFF" stroke="#1E1B3A" stroke-width="2"/>
<text x="1160" y="328" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1E1B3A">claude.ai</text>
<text x="1160" y="346" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1E1B3A">version</text>
<text x="1160" y="366" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">The same file as</text>
<text x="1160" y="382" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">an artifact uses</text>
<text x="1160" y="398" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">claude.ai&#x27;s own</text>
<text x="1160" y="414" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">AI instead of the</text>
<text x="1160" y="430" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1E1B3A">relay.</text>
<text x="24" y="522" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px" fill="#5A5675">WHO DECIDES WHAT</text>
<rect x="24" y="536" width="420" height="100" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="34" y="558" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">AI writes and marks</text>
<text x="34" y="578" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">Scenes, options, debriefs, the check-in, and what your</text>
<text x="34" y="594" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">written answers name. It can be wrong; every piece is</text>
<text x="34" y="610" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">labeled.</text>
<rect x="460" y="536" width="420" height="100" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="470" y="558" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">Code keeps the score</text>
<text x="470" y="578" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">Meter limits, wellbeing, the verdict, decisions 1-2, the</text>
<text x="470" y="594" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">completeness read, the 1:1 sheet, the daily cap.</text>
<rect x="896" y="536" width="400" height="100" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="906" y="558" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">You decide</text>
<text x="906" y="578" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">What to ask, what to do, what it costs, what to say,</text>
<text x="906" y="594" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">and how complete you think it is.</text>
