<text x="24" y="70" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px" fill="#5A5675">THE GAME, START TO FINISH</text>
<rect x="24" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="34" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Benchmark</text>
<text x="34" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Answer one short</text>
<text x="34" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">scenario. AI</text>
<text x="34" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">marks protects,</text>
<text x="34" y="174" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">cost, who pays,</text>
<text x="34" y="190" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">delivery.</text>
<line x1="156" y1="150.0" x2="166" y2="150.0" stroke="#1E1B3A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="166" y="84" width="132" height="132" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="176" y="106" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">Decisions 1-2</text>
<text x="176" y="126" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Pick the plan,</text>
<text x="176" y="142" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">the trade-off and</text>
<text x="176" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">the first words.</text>
