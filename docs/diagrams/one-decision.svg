<rect x="80" y="514" width="168" height="140" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="90" y="536" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">1. Build the</text>
<text x="90" y="554" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">prompt</text>
<text x="90" y="574" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">World and cast, the</text>
<text x="90" y="590" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">plan for this</text>
<text x="90" y="606" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">decision, the story</text>
<text x="90" y="622" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">so far, meter words.</text>
<rect x="262" y="316" width="168" height="140" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="272" y="338" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">2. Scenario</text>
<text x="272" y="356" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">builder</text>
<text x="272" y="376" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">A memo, four</text>
<text x="272" y="392" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">questions, one</text>
<text x="272" y="408" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">hidden fact, and a</text>
<text x="272" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">&quot;since last time&quot;</text>
<text x="272" y="440" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">nudge.</text>
<rect x="446" y="316" width="168" height="140" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="456" y="338" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">3. Decision</text>
<text x="456" y="356" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">builder</text>
<text x="456" y="376" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">Five options with</text>
<text x="456" y="392" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">meter moves and</text>
<text x="456" y="408" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">trade-offs, two</text>
<text x="456" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">first-line openings,</text>
<text x="456" y="440" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">a manager&#x27;s advice.</text>
<rect x="446" y="118" width="168" height="130" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="456" y="140" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">4. Ask two</text>
<text x="456" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">questions</text>
<text x="456" y="178" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Each answer may</text>
<text x="456" y="194" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">reveal the hidden</text>
<text x="456" y="210" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">fact.</text>
<rect x="630" y="118" width="178" height="130" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="640" y="140" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">5. Decide</text>
<text x="640" y="160" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Pick or write the</text>
<text x="640" y="176" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">plan, trade-off and</text>
<text x="640" y="192" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">first words. Rate how</text>
<text x="640" y="208" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">complete it is (D3-6).</text>
<rect x="814" y="514" width="168" height="140" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="824" y="536" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">6a. Code judges</text>
<text x="824" y="554" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">(D1-2)</text>
<text x="824" y="574" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">You picked</text>
<text x="824" y="590" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">everything, so the</text>
<text x="824" y="606" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">option&#x27;s own moves</text>
<text x="824" y="622" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">and the opening&#x27;s</text>
<text x="824" y="638" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">verdict apply.</text>
<rect x="814" y="316" width="168" height="140" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="824" y="338" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">6b. Judge (D3-6)</text>
<text x="824" y="358" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">Marks five checks,</text>
<text x="824" y="374" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">notes what you</text>
<text x="824" y="390" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">surfaced, proposes</text>
<text x="824" y="406" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">meter moves with</text>
<text x="824" y="422" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">reasons.</text>
<rect x="998" y="514" width="168" height="140" rx="10" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/>
<text x="1008" y="536" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#1F2937">7. Rules</text>
<text x="1008" y="556" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">Caps each move at 2,</text>
<text x="1008" y="572" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">falls back if the</text>
<text x="1008" y="588" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">judge moves nothing,</text>
<text x="1008" y="604" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">sets wellbeing, logs</text>
<text x="1008" y="620" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#1F2937">completeness.</text>
<rect x="998" y="316" width="168" height="140" rx="10" fill="#EFE9FF" stroke="#5B3DF5" stroke-width="2"/>
<text x="1008" y="338" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#2A1A7A">8. Narrator</text>
<text x="1008" y="358" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">What happened, why</text>
<text x="1008" y="374" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">each meter moved,</text>
<text x="1008" y="390" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">how your approach</text>
<text x="1008" y="406" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#2A1A7A">worked, another way.</text>
<rect x="1132" y="118" width="160" height="130" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="1142" y="140" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">9. Read the</text>
<text x="1142" y="158" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:700" fill="#0B3B36">debrief</text>
<text x="1142" y="178" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">Then the next</text>
<text x="1142" y="194" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">decision, or the</text>
<text x="1142" y="210" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#0B3B36">check-in after six.</text>
