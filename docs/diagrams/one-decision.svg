<rect width="1320" height="690" fill="#FFFDF6"/>
<text x="24" y="34" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;font-weight:800" fill="#1E1B3A">One decision: who does what</text>
<text x="24" y="56" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px" fill="#5A5675">Six decisions run this loop. The story log grows each time, and the next scene starts from what your last plan caused.</text>
<text x="900" y="50" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700" fill="#1E1B3A">Color key</text>
