<rect x="1203.5" y="36" width="18" height="18" rx="4" fill="#EEEEF2" stroke="#4B5563" stroke-width="2"/><text x="1229.5" y="50" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px" fill="#1E1B3A">Code</text>
